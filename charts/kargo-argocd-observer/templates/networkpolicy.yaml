{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kargo-argocd-observer.fullname" . }}
  {{- with (include "kargo-argocd-observer.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "kargo-argocd-observer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kargo-argocd-observer.selectorLabels" . | nindent 6 }}
  # Ingress only: the metrics port is the single thing the pod serves to the
  # cluster. Kubelet probes come from the pod's own node, which NetworkPolicy
  # always allows. Egress (API server, DNS) is left unrestricted.
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: metrics
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
