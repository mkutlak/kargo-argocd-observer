{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kargo-argocd-observer.fullname" . }}
  {{- with (include "kargo-argocd-observer.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "kargo-argocd-observer.labels" . | nindent 4 }}
rules:
  # Watch ArgoCD Applications cluster-wide to detect the deployed version.
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch

  # Read Kargo's view of the world. Only Stages are watched; the verbs below
  # are exactly the calls the controller makes — extend them together with
  # the code (e.g. a Freight watch needs list+watch).
  - apiGroups:
      - kargo.akuity.io
    resources:
      - stages
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kargo.akuity.io
    resources:
      - warehouses
    verbs:
      - get
  - apiGroups:
      - kargo.akuity.io
    resources:
      - freights
    verbs:
      - list

  # List a Stage's Promotions and create one when drift between ArgoCD and
  # Kargo is detected.
  - apiGroups:
      - kargo.akuity.io
    resources:
      - promotions
    verbs:
      - list
      - create

  # Kargo's admission webhook SubjectAccessReview-checks this virtual verb when a Promotion is created
  - apiGroups:
      - kargo.akuity.io
    resources:
      - stages
    verbs:
      - promote

  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
