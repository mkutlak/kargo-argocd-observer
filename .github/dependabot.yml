version: 2
# Every ecosystem is checked twice a month (1st and 15th): Dependabot has no
# two-week interval.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5 1,15 * *"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
  # Keeps the digest-pinned base images in the Dockerfile current.
  # fix(deps) so that merging one releases an image built on the new base
  # (the chart's default tag still needs its appVersion bumped by hand).
  # The cooldown keeps a same-day bad release from being proposed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5 1,15 * *"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
    ignore:
      # The Go minor version moves together with go.mod and mise.toml, by
      # hand: CI tests and govulncheck run on mise's Go, not the image's.
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5 1,15 * *"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
  # The release toolchain (.github/release/package-lock.json).
  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: cron
      cronjob: "0 5 1,15 * *"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # semantic-release 26 needs Node >= 26.13: bump node-version in
      # release.yml together with it, by hand.
      - dependency-name: semantic-release
        update-types:
          - version-update:semver-major
      # v10+ fails or renders EMPTY release notes with semantic-release 25's
      # release-notes-generator. Re-check with a dry run before bumping.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
